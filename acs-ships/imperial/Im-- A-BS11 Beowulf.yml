      Using a 200-ton hull, the free trader is an elementary interstellar merchant ship plying the space lanes carrying cargo and passengers. It has jump drive-A, maneuver drive-A, and power plant-A, giving performance of jump-1 and 1-G acceleration. Fuel tankage supports the power plant and one jump-1. Adjacent to the bridge is a computer Model/1. There are 12 staterooms and twenty low berths. There are two hardpoints, but no weapons are mounted. There are no ship's vehicles. Cargo capacity is 82 tons. The hull is streamlined.
      
