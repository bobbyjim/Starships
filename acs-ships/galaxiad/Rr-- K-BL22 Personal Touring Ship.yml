   comments: |
      Using a 200-ton, TL16 hull, the Touring Ship mounts advanced B-class drives, giving a performance of jump-2 and 2G acceleration. Fuel tankage supports a 2 parsec jump, at 16t per parsec, and one month of operations. Attached to the bridge is a Computer Model/8. There are four crew staterooms, four luxury passenger staterooms, four standard passenger staterooms, and no low berths. There are two empty single turrets installed. Cargo capacity is 10 tons. The ship has a lift body hull, with scoops for frontier refueling. The hull is balanced for floating, and is capable of submersible activities.
      
      Carried craft include a Launch in a Hull Niche. It carries up to 8 passengers. The yacht requires a Pilot-2, Astrogator-2, Engineer-2, and Medic. Two gunners would typically also be aboard if the ship mounts weaponry. However, it usually only has a crew of two: a pilot/engineer and a medic. The pilot/engineer usually doesn’t have anything to do except perhaps amuse the nobles on board. The ship’s computer is capable of taking on up to eight crew positions simultaneously. However, a “living” medic is typically preferred over the AI medical personality, and a human pilot is there for planning and troubleshooting.
