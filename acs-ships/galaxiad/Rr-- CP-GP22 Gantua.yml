   comments: |
      Gantua-class Mercenary Cruiser (CP-GP11, MCr 236). Using a 700-ton, TL13 hull, the Gantua mounts jump drive-G, maneuver drive-G, and power plant-G, giving a performance of jump-2 and 2G acceleration. Fuel tankage supports a 2 parsec jump, at 63t per parsec, and 2 months of operations. A Collector provides refueling options. Attached to the bridge is a Computer Model/3. There are 13 staterooms and no low berths. Barracks provide living space for a platoon of marines. Installed weaponry include two B2de Particle Accelerators, three B2de Missiles, and two B2de Sandcasters. It mounts a nuclear damper, mag scrambler, and a prized black globe. Cargo capacity is 14 tons. The ship is a planetoid hull. 
      
      Carried craft include two GCarriers and three 30t Gunboats in Hull Niches. The ship has up to 13 crew: Captain, Pilot, Astrogator, two Engineers, Medic, and up to seven Gunners. 
